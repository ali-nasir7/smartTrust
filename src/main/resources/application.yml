spring:
  application:
    name: smarttrust-backend

  # Loads a .env file (KEY=VALUE lines) from the project root if present.
  # Never commit .env — see .env.example
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      enabled: true
      max-file-size: ${UPLOAD_MAX_FILE_MB:5}MB
      max-request-size: ${UPLOAD_MAX_REQUEST_MB:20}MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smarttrust?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4}
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      leak-detection-threshold: 2000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc.time_zone: UTC
        dialect: org.hibernate.dialect.MySQLDialect

  # SMTP — all values come from environment variables (.env), never hardcoded.
  # See .env.example for Gmail App Password setup.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: ${SMTP_TIMEOUT_MS:5000}
          timeout: ${SMTP_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_TIMEOUT_MS:5000}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# JWT
smarttrust:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-must-be-at-least-64-chars-long-for-hs256-alg-0123456789AB}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 min
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: smarttrust-api

  otp:
    length: ${OTP_LENGTH:6}
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    # DEV ONLY: logs OTP to console when SMTP is not configured.
    # OTP is NEVER returned in API responses. Keep false in production.
    mock-enabled: ${OTP_MOCK_ENABLED:false}

  mail:
    from: ${MAIL_FROM:noreply@smarttrust.pk}
    from-name: ${MAIL_FROM_NAME:SmartTrust}

  security:
    bcrypt-strength: 12
    max-failed-login-attempts: 5
    lock-time-minutes: 15
    refresh-token-length-bytes: 48

  rate-limit:
    login-bucket-capacity: 5
    login-refill-minutes: 15

  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size-bytes: ${UPLOAD_MAX_FILE_BYTES:5242880} # 5MB default (value in bytes)
    allowed-content-types: image/jpeg,image/png,image/webp

  # Optional admin bootstrap (creates first ADMIN if phone not registered; no-op when unset)
  admin:
    phone: ${ADMIN_PHONE:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

server:
  port: 8080
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.smarttrust: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

---
# LOCAL PROFILE: MySQL local dev
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smarttrust?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASS:}
  jpa:
    show-sql: true
logging:
  level:
    com.smarttrust: DEBUG

---
# POSTGRESQL PROFILE: if you want to switch to Postgres later
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smarttrust}
    username: ${DB_USER:smarttrust}
    password: ${DB_PASS:smarttrust123}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

---
# TEST PROFILE: H2 in-memory
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never
smarttrust:
  jwt:
    secret: test-jwt-secret-must-be-at-least-64-chars-long-for-hs256-test-1234567890AB
  otp:
    mock-enabled: true
  mail:
    from: test@smarttrust.pk
    from-name: SmartTrust Test
